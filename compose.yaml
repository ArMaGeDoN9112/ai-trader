services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trader
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${TRADER_POSTGRES_PASSWORD:-trader-local}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "trader", "-d", "trader"]
      interval: 5s
      timeout: 3s
      retries: 6

  backend:
    build: ./backend
    command: ["operator-api", ".local/runtime.json", "--bind", "0.0.0.0"]
    init: true
    stop_signal: SIGINT
    stop_grace_period: 60s
    environment:
      XDG_STATE_HOME: /state
      DATABASE_URL: "host=postgres dbname=trader user=trader"
      PGPASSWORD: ${TRADER_POSTGRES_PASSWORD:-trader-local}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.local
        target: /app/backend/.local
        bind:
          create_host_path: false
      - telegram:/state
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/session', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:80"

volumes:
  postgres:
  telegram:
