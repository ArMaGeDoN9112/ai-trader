server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    if ($http_host != "127.0.0.1:8765") {
        return 403;
    }

    location /api/ {
        client_max_body_size 32k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend backend:8765;
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
    }

    location / {
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; script-src 'self'; style-src 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        try_files $uri $uri/ =404;
    }
}
